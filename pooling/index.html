<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Polling System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .connection-status {
            text-align: center;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .create-poll-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .create-poll-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .option-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .option-input-group input {
            flex: 1;
        }

        .option-input-group button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
        }

        .option-input-group button:hover {
            background: #c82333;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .polls-section {
            margin-top: 30px;
        }

        .poll-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .poll-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .poll-header h3 {
            color: #333;
            font-size: 1.3em;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .poll-option {
            position: relative;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .poll-option:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .option-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            opacity: 0.2;
            transition: width 0.5s ease;
        }

        .option-content {
            position: relative;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-text {
            font-weight: 600;
            color: #333;
        }

        .option-votes {
            color: #666;
            font-size: 0.9em;
        }

        .poll-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            color: #666;
        }

        .no-polls {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            color: #666;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Polling System</h1>
        
        <div id="status" class="connection-status disconnected">
            Connecting...
        </div>

        <div class="create-poll-section">
            <h2>Create New Poll</h2>
            <form id="createPollForm">
                <div class="form-group">
                    <label for="questionInput">Question</label>
                    <input type="text" id="questionInput" placeholder="Enter your poll question" required>
                </div>
                <div class="form-group">
                    <label>Options</label>
                    <div id="optionsContainer"></div>
                    <button type="button" id="addOptionBtn" class="btn-secondary">Add Option</button>
                </div>
                <button type="submit" class="btn-primary">Create Poll</button>
            </form>
        </div>

        <div class="polls-section">
            <div id="pollsContainer">
                <div class="no-polls">Loading polls...</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
