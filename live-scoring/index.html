<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div>
        <div class="scoreboard">
        <h3>Team Management</h3>
        <div class="team-form">
            <input type="text" id="teamAName" placeholder="Team A" />
            <input type="text" id="teamBName" placeholder="Team B" />
            <button id="setNamesBtn">Set Team Names</button>            <button id="clearAllBtn" class="clear-btn">Clear All Scoreboards</button>        </div>
    </div>
    <div class="scoreboard">
        <h1>Live Scoreboard</h1>
        
        <div id="status" class="connection-status disconnected">
            Connecting...
        </div>
        <div class="scores">
            <div class="team">
                <div class="team-name">Team A</div>
                <div class="score" id="scoreA">0</div>
                <div class="controls">
                    <button onclick="updateScore('A')" id="btnA">+1</button>
                </div>
            </div>

            <div class="team">
                <div class="team-name">Team B</div>
                <div class="score" id="scoreB">0</div>
                <div class="controls">
                    <button onclick="updateScore('B')" id="btnB">+1</button>
                </div>
            </div>
        </div>
    </div>

    <div id="listTeam"></div>

    <script src="app.js"></script>
</body>
</html>
