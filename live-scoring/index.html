<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .scoreboard {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            margin-bottom: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .connection-status {
            text-align: center;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .scores {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .score {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Team Management Form Styles */
        .scoreboard h3 {
            color: #333;
            margin-bottom: 25px;
            font-size: 1.4em;
            font-weight: 700;
            text-align: center;
            position: relative;
        }

        .scoreboard h3::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .scoreboard input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1em;
            font-family: inherit;
            background: #f8f9fa;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .scoreboard input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .scoreboard input[type="text"]::placeholder {
            color: #adb5bd;
            font-style: italic;
        }

        .scoreboard button#setNamesBtn {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .scoreboard button#setNamesBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .scoreboard button#setNamesBtn:hover::before {
            left: 100%;
        }

        .scoreboard button#setNamesBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .scoreboard button#setNamesBtn:active {
            transform: translateY(-1px);
        }

        .team-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mb {
            margin-bottom: 20px;
        }

        #listTeam {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div>
        <div class="scoreboard">
        <h3>Team Management</h3>
        <div class="team-form">
            <input type="text" id="teamAName" placeholder="Team A" />
            <input type="text" id="teamBName" placeholder="Team B" />
            <button id="setNamesBtn">Set Team Names</button>
        </div>
    </div>
    <div class="scoreboard">
        <h1>Live Scoreboard</h1>
        
        <div id="status" class="connection-status disconnected">
            Connecting...
        </div>
        <div class="scores">
            <div class="team">
                <div class="team-name">Team A</div>
                <div class="score" id="scoreA">0</div>
                <div class="controls">
                    <button onclick="updateScore('A')" id="btnA">+1</button>
                </div>
            </div>

            <div class="team">
                <div class="team-name">Team B</div>
                <div class="score" id="scoreB">0</div>
                <div class="controls">
                    <button onclick="updateScore('B')" id="btnB">+1</button>
                </div>
            </div>
        </div>
    </div>

    <div id="listTeam"></div>

    <script src="app.js"></script>
</body>
</html>
